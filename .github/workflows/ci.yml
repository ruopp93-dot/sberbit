name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/sberbits_ci
        run: npx prisma@6.15.0 validate
      - name: Generate Prisma client
        run: npx prisma@6.15.0 generate
      - name: Build
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/sberbits_ci
        run: npm run build
